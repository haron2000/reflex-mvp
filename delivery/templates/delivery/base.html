<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex{% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <span class="font-semibold text-lg">Reflex</span>
    {% if user.is_authenticated %}
    <div class="flex items-center gap-3 text-sm">
      <span class="text-gray-500">{{ user.username }}{% if user.profile %} · {{ user.profile.get_role_display }}{% endif %}</span>
      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="text-gray-500 hover:text-gray-900 bg-transparent border-0 p-0 cursor-pointer">Log out</button>
      </form>
    </div>
    {% endif %}
  </nav>
  <main class="max-w-2xl mx-auto p-4">
    {% block content %}{% endblock %}
  </main>

  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }
    const CSRF_TOKEN = getCookie('csrftoken');

    async function apiFetch(url, options = {}) {
      options.headers = Object.assign({}, options.headers, {
        'X-CSRFToken': CSRF_TOKEN,
        'Content-Type': 'application/json',
      });
      const res = await fetch(url, options);
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        const err = new Error((data && data.detail) || `Request failed (${res.status})`);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    const STATUS_LABEL = {REQUESTED: 'Requested', ASSIGNED: 'Assigned', PICKED_UP: 'Picked up', DELIVERED: 'Delivered', CANCELLED: 'Cancelled'};
    const STATUS_CLASS = {
      REQUESTED: 'bg-gray-100 text-gray-700',
      ASSIGNED: 'bg-blue-100 text-blue-700',
      PICKED_UP: 'bg-amber-100 text-amber-700',
      DELIVERED: 'bg-green-100 text-green-700',
      CANCELLED: 'bg-red-100 text-red-700',
    };
    function statusBadge(status) {
      return `<span class="text-xs font-medium px-2.5 py-1 rounded-full ${STATUS_CLASS[status] || ''}">${STATUS_LABEL[status] || status}</span>`;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
