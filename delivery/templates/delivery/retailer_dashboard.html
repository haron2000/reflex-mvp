{% extends "delivery/base.html" %} 
{% block title %} · Retailer{% endblock %} 
{% block content %}

<div class="bg-white border border-gray-200 rounded-xl p-4 mb-6">
  <p class="text-sm text-gray-500 mb-3">Log a new delivery</p>
  <div class="grid grid-cols-2 gap-2">
    <input
      id="f-name"
      placeholder="Customer name"
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm col-span-2 sm:col-span-1"
    />
    <input
      id="f-phone"
      placeholder="Phone number"
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm col-span-2 sm:col-span-1"
    />
    <input
      id="f-address"
      placeholder="Delivery address"
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm col-span-2"
    />
    <input
      id="f-item"
      placeholder="Item description"
      class="border border-gray-300 rounded-lg px-3 py-2 text-sm col-span-2"
    />
  </div>
  <button
    id="btn-create"
    class="mt-3 bg-gray-900 text-white rounded-lg px-4 py-2 text-sm font-medium"
  >
    Create request
  </button>
  <p id="f-error" class="text-sm text-red-600 mt-2 hidden"></p>
</div>

<p class="text-sm text-gray-500 mb-2">Your deliveries</p>
<div id="list" class="flex flex-col gap-3"></div>
{% endblock %}
{% block scripts %}
<script>
  async function refresh() {
    const items = await apiFetch("/api/requests/");
    const list = document.getElementById("list");
    if (items.length === 0) {
      list.innerHTML =
        '<p class="text-sm text-gray-400">No deliveries logged yet.</p>';
      return;
    }
    list.innerHTML = items
      .map(
        (d) => `
    <div class="bg-white border border-gray-200 rounded-xl p-4">
      <div class="flex justify-between items-center mb-1">
        <span class="font-medium text-sm">#${d.id} · ${d.customer_name}</span>
        ${statusBadge(d.status)}
      </div>
      <p class="text-sm text-gray-500">${d.item_description}</p>
      <p class="text-xs text-gray-400 mt-1">${d.customer_address}${d.assigned_rider_name ? " · rider: " + d.assigned_rider_name : ""}</p>
            ${
              d.status !== "DELIVERED" && d.status !== "CANCELLED"
                ? `
        <details class="mt-2">
          <summary class="text-xs text-gray-500 cursor-pointer">Show pickup/delivery code</summary>
          <img src="/qr/${d.id}.png" alt="QR code for delivery ${d.id}" class="w-32 h-32 mt-2 border border-gray-100 rounded">
          <p class="text-xs text-gray-400 mt-1 select-all font-mono">${d.qr_token}</p>
        </details>`
                : ""
            }
      ${
        d.history.length
          ? `<div class="mt-2 pt-2 border-t border-gray-100 text-xs text-gray-400">
        ${d.history.map((h) => `${STATUS_LABEL[h.status]} at ${new Date(h.timestamp).toLocaleTimeString()}`).join(" · ")}
      </div>`
          : ""
      }
    </div>
  `,
      )
      .join("");
  }

  document.getElementById("btn-create").addEventListener("click", async () => {
    const err = document.getElementById("f-error");
    const payload = {
      customer_name: document.getElementById("f-name").value.trim(),
      customer_phone: document.getElementById("f-phone").value.trim(),
      customer_address: document.getElementById("f-address").value.trim(),
      item_description: document.getElementById("f-item").value.trim(),
    };
    if (Object.values(payload).some((v) => !v)) {
      err.textContent = "Fill in all fields before creating the request.";
      err.classList.remove("hidden");
      return;
    }
    try {
      await apiFetch("/api/requests/", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      err.classList.add("hidden");
      ["f-name", "f-phone", "f-address", "f-item"].forEach(
        (id) => (document.getElementById(id).value = ""),
      );
      refresh();
    } catch (e) {
      err.textContent = e.message;
      err.classList.remove("hidden");
    }
  });

  refresh();
  setInterval(refresh, 5000); // auto-refresh -- see trade-off log: polling stands in for WebSocket push in this build
</script>
{% endblock %}
